<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hello-word-A</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    main {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main aria-label="Greeting screen">
    <h1>Hello Word</h1>
  </main>
</body>
</html>
